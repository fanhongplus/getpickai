<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 深蓝渐变背景 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0d1f"/>
      <stop offset="50%" stop-color="#111640"/>
      <stop offset="100%" stop-color="#1a1f52"/>
    </linearGradient>
    <!-- 光晕效果 -->
    <radialGradient id="glowTop" cx="800" cy="100" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f6ef7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4f6ef7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="300" cy="550" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="600" cy="315" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景层 -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowTop)"/>
  <rect width="1200" height="630" fill="url(#glowBottom)"/>
  <rect width="1200" height="630" fill="url(#glowCenter)"/>

  <!-- 网格装饰 (subtle) -->
  <line x1="0" y1="0" x2="1200" y2="630" stroke="#4f6ef7" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="1200" y1="0" x2="0" y2="630" stroke="#4f6ef7" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#4f6ef7" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#4f6ef7" stroke-opacity="0.02" stroke-width="1"/>

  <!-- 装饰圆点 -->
  <circle cx="950" cy="120" r="80" fill="#4f6ef7" fill-opacity="0.06"/>
  <circle cx="1050" cy="180" r="40" fill="#818cf8" fill-opacity="0.05"/>
  <circle cx="150" cy="480" r="60" fill="#6366f1" fill-opacity="0.05"/>

  <!-- 顶部标签 -->
  <rect x="100" y="135" width="100" height="32" rx="16" fill="#4f6ef7" fill-opacity="0.2"/>
  <text x="150" y="156" text-anchor="middle" fill="#93a4fc" font-size="14" font-family="'DM Sans', sans-serif" font-weight="600">亲测排名</text>

  <!-- 年份标签 -->
  <rect x="215" y="135" width="70" height="32" rx="16" fill="#ffffff" fill-opacity="0.08"/>
  <text x="250" y="156" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="'DM Sans', sans-serif" font-weight="500">2026</text>

  <!-- 主标题第1行 -->
  <text x="100" y="240" fill="#ffffff" font-size="62" font-family="'Noto Sans SC', 'DM Sans', sans-serif" font-weight="800" letter-spacing="-1">2026年最值得付费的</text>

  <!-- 主标题第2行 - 带强调色 -->
  <text x="100" y="320" fill="#ffffff" font-size="62" font-family="'Noto Sans SC', 'DM Sans', sans-serif" font-weight="800" letter-spacing="-1">10个</text>
  <text x="260" y="320" fill="#8b9cf7" font-size="62" font-family="'Noto Sans SC', 'DM Sans', sans-serif" font-weight="800" letter-spacing="-1">AI工具</text>

  <!-- 副标题 -->
  <text x="100" y="375" fill="#64748b" font-size="22" font-family="'Noto Sans SC', sans-serif" font-weight="400">每一个都经过至少两周的真实使用体验</text>

  <!-- 分隔线 -->
  <rect x="100" y="410" width="80" height="3" rx="1.5" fill="#4f6ef7"/>

  <!-- 工具Logo行 -->
  <!-- 1. ChatGPT -->
  <rect x="100" y="445" width="44" height="44" rx="11" fill="#10a37f"/>
  <text x="122" y="473" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="'DM Sans', sans-serif">G</text>
  <!-- 2. Claude -->
  <rect x="156" y="445" width="44" height="44" rx="11" fill="#cc9b6d"/>
  <text x="178" y="473" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="'DM Sans', sans-serif">C</text>
  <!-- 3. Midjourney -->
  <rect x="212" y="445" width="44" height="44" rx="11" fill="#ffffff" fill-opacity="0.12"/>
  <text x="234" y="473" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="'DM Sans', sans-serif">M</text>
  <!-- 4. Canva -->
  <rect x="268" y="445" width="44" height="44" rx="11" fill="#00c4cc"/>
  <text x="290" y="473" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="'DM Sans', sans-serif">C</text>
  <!-- 5. CapCut -->
  <rect x="324" y="445" width="44" height="44" rx="11" fill="#000000" stroke="#333" stroke-width="1"/>
  <text x="346" y="473" text-anchor="middle" fill="white" font-size="14" font-weight="700" font-family="'DM Sans', sans-serif">CC</text>
  <!-- 6. HeyGen -->
  <rect x="380" y="445" width="44" height="44" rx="11" fill="#1d4ed8"/>
  <text x="402" y="473" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="'DM Sans', sans-serif">H</text>
  <!-- 7. Jasper -->
  <rect x="436" y="445" width="44" height="44" rx="11" fill="#4f6ef7"/>
  <text x="458" y="473" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="'DM Sans', sans-serif">J</text>
  <!-- 8. ElevenLabs -->
  <rect x="492" y="445" width="44" height="44" rx="11" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <text x="514" y="473" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="'DM Sans', sans-serif">E</text>
  <!-- 9. Cursor -->
  <rect x="548" y="445" width="44" height="44" rx="11" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <text x="570" y="473" text-anchor="middle" fill="white" font-size="14" font-weight="700" font-family="'DM Sans', sans-serif">Cu</text>
  <!-- 10. Writesonic -->
  <rect x="604" y="445" width="44" height="44" rx="11" fill="#6c5ce7"/>
  <text x="626" y="473" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="'DM Sans', sans-serif">W</text>

  <!-- 底部品牌 -->
  <text x="100" y="560" fill="#4f6ef7" font-size="20" font-family="'DM Sans', sans-serif" font-weight="700">Go</text>
  <text x="126" y="560" fill="#4f6ef7" font-size="20" font-family="'DM Sans', sans-serif" font-weight="700">Pick</text>
  <text x="166" y="560" fill="#ffffff" font-size="20" font-family="'DM Sans', sans-serif" font-weight="700"> AI</text>
  <text x="200" y="560" fill="#4a5568" font-size="16" font-family="'Noto Sans SC', sans-serif" font-weight="400">  帮你挑出最值得用的 AI 工具</text>

  <!-- 右侧装饰大数字 -->
  <text x="1020" y="420" fill="#ffffff" fill-opacity="0.03" font-size="280" font-family="'DM Sans', sans-serif" font-weight="900">10</text>
</svg>
