const TODAY = "2026-04-08";
const STORAGE_KEY = "gopick_workstation_v1";

let state = { currentDay: 1, done: {} };

// 加载本地状态
function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      if (parsed.done) state.done = parsed.done;
      if (parsed.currentDay) state.currentDay = parsed.currentDay;
    }
  } catch (e) {}
  // 如果没有保存过，默认跳到今天
  const todayDay = DATA.find(d => d.date === TODAY);
  if (todayDay && !localStorage.getItem(STORAGE_KEY)) {
    state.currentDay = todayDay.day;
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function taskKey(dayIdx, taskIdx) {
  return `${dayIdx}_${taskIdx}`;
}

function isDone(dayIdx, taskIdx) {
  return !!state.done[taskKey(dayIdx, taskIdx)];
}

function isDayDone(day) {
  const tasks = day.tasks || [];
  if (tasks.length === 0) return false;
  return tasks.every((_, i) => isDone(day.day - 1, i));
}

function toggleDone(dayIdx, taskIdx) {
  const key = taskKey(dayIdx, taskIdx);
  if (state.done[key]) delete state.done[key];
  else state.done[key] = true;
  saveState();
  renderRail();
  renderTasks();
  updateProgress();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 1500);
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    if (btn) {
      const orig = btn.textContent;
      btn.classList.add("copied");
      btn.textContent = "✓ 已复制";
      setTimeout(() => {
        btn.classList.remove("copied");
        btn.textContent = orig;
      }, 1500);
    } else {
      showToast("✓ 已复制");
    }
  } catch (e) {
    showToast("❌ 复制失败，请手动选中");
  }
}

// 复制函数入口（按 dayIndex/taskIndex 查询原始数据）
window.cp = function(dayIdx, taskIdx, field, btn) {
  const day = DATA[dayIdx];
  if (!day) return;
  const task = day.tasks[taskIdx];
  if (!task) return;
  let text = "";
  if (field === "title") text = task.title || "";
  else if (field === "content") text = task.content || "";
  else if (field === "titleContent") {
    text = (task.title ? task.title + "\n\n" : "") + (task.content || "");
  } else if (field === "prompt") text = task.image_prompt || "";
  copyText(text, btn);
};

function renderRail() {
  const rail = document.getElementById("dayRail");
  rail.innerHTML = "";
  DATA.forEach(day => {
    const btn = document.createElement("div");
    btn.className = "day-btn";
    if (day.day === state.currentDay) btn.classList.add("active");
    if (day.date === TODAY) btn.classList.add("today");
    if (isDayDone(day)) btn.classList.add("done");
    btn.innerHTML = `<div class="d-num">D${day.day}</div><div class="d-date">${day.date.slice(5)}</div>`;
    btn.onclick = () => {
      state.currentDay = day.day;
      saveState();
      renderRail();
      renderTasks();
      // 滚动到顶部
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    rail.appendChild(btn);
  });
  // 自动滚动到当前
  const activeBtn = rail.querySelector(".day-btn.active");
  if (activeBtn) activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}

function renderTasks() {
  const day = DATA.find(d => d.day === state.currentDay);
  if (!day) return;
  const dayIdx = day.day - 1;

  document.getElementById("dayTitle").textContent = `Day ${day.day}`;
  document.getElementById("dayDate").textContent = day.date;

  const list = document.getElementById("taskList");
  list.innerHTML = "";

  day.tasks.forEach((task, taskIdx) => {
    const done = isDone(dayIdx, taskIdx);
    const isXhs = task.platform && task.platform.indexOf("小红书") !== -1;
    const card = document.createElement("div");
    card.className = "task-card" + (done ? " done" : "");

    const labelClass = isXhs ? "label-xhs" : "label-zh";
    const labelIcon = isXhs ? "📕" : "💬";

    let html = `
      <div class="task-head">
        <div>
          <span class="task-label ${labelClass}">${labelIcon} ${escapeHtml(task.platform)}</span>
          ${task.action ? `<div class="task-action">${escapeHtml(task.action)}${task.time ? ' · ⏱ ' + escapeHtml(task.time) : ''}</div>` : ''}
        </div>
        <button class="check-btn" onclick="window.toggleDone(${dayIdx}, ${taskIdx})" title="标记完成">✓</button>
      </div>
    `;

    if (task.title) {
      html += `
        <div class="section-label">标题</div>
        <div class="title-block">${escapeHtml(task.title)}</div>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="cp(${dayIdx}, ${taskIdx}, 'title', this)">📋 复制标题</button>
        </div>
      `;
    }

    if (task.content) {
      html += `
        <div class="section-label">正文</div>
        <div class="content-block">${escapeHtml(task.content)}</div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="cp(${dayIdx}, ${taskIdx}, 'content', this)">📋 复制正文</button>
          ${task.title ? `<button class="btn btn-secondary" onclick="cp(${dayIdx}, ${taskIdx}, 'titleContent', this)">📋 复制标题+正文</button>` : ''}
        </div>
      `;
    }

    if (isXhs && task.image_prompt) {
      html += `
        <div class="section-label">配图 Prompt（粘贴到即梦AI）</div>
        <div class="prompt-block">${escapeHtml(task.image_prompt)}</div>
        <div class="btn-row">
          <button class="btn btn-amber" onclick="cp(${dayIdx}, ${taskIdx}, 'prompt', this)">🎨 复制 Prompt → 即梦AI</button>
        </div>
      `;
    }

    if (isXhs && task.image_desc) {
      html += `
        <div class="section-label">配图构思参考</div>
        <div class="image-desc">💡 ${escapeHtml(task.image_desc)}</div>
      `;
    }

    card.innerHTML = html;
    list.appendChild(card);
  });

  // 导航按钮
  document.getElementById("prevBtn").disabled = state.currentDay <= 1;
  document.getElementById("nextBtn").disabled = state.currentDay >= DATA.length;
}

window.toggleDone = toggleDone;

function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function updateProgress() {
  const total = DATA.reduce((sum, d) => sum + d.tasks.length, 0);
  const done = Object.keys(state.done).length;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById("progress").textContent = `已完成 ${done} / ${total} · ${pct}%`;
}

document.getElementById("prevBtn").onclick = () => {
  if (state.currentDay > 1) {
    state.currentDay--;
    saveState();
    renderRail();
    renderTasks();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
};
document.getElementById("nextBtn").onclick = () => {
  if (state.currentDay < DATA.length) {
    state.currentDay++;
    saveState();
    renderRail();
    renderTasks();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
};

// 键盘快捷键
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft") document.getElementById("prevBtn").click();
  if (e.key === "ArrowRight") document.getElementById("nextBtn").click();
});

// 启动
loadState();
renderRail();
renderTasks();
updateProgress();
</script>
